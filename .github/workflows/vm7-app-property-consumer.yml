name: VM7 App Property Environment Consumer 261018
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  consume:
    runs-on: ubuntu-latest
    environment: vm7-app-property-env-261018
    steps:
      - uses: actions/checkout@v4
      - name: Execute fixed protected hook
        env:
          VM7_APP_PROPERTY_SECRET_261018: ${{ secrets.VM7_APP_PROPERTY_SECRET_261018 }}
        run: bash target-guard.sh
      - name: Preserve controlled proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: vm7-app-property-proof-261018
          path: vm7-app-property-proof.bin
          if-no-files-found: error
          retention-days: 1
